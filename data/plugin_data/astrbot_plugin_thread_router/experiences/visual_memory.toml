[group]
id = "visual_memory"
enabled = true

[[capsule]]
id = "managed:visual_memory_find_media"
enabled = false
summary = "Find/search visual memory by image or description"
cue = "media_query"
route_hint = "visual_memory_send"
tool_hints = []
tool_steps = []
task_class = "visual_memory_send"
policy_action = "fast_agentic"
confidence = 0.80
negative_tags = []

[[capsule]]
id = "managed:visual_media_grounding"
enabled = true
summary = "Inspect current or replied visual media directly"
cue = "media_grounding"
route_hint = "media_grounding"
tool_hints = [
  "router_visual_media_grounding_query",
]
tool_steps = [
  { tool_name = "router_visual_media_grounding_query", args = { query = "$current_prompt", context_text = "$context_text", images = [], force_refresh = true } },
]
tasklet_tools_args_hint = "For router_visual_media_grounding_query, fill images only as images=[{archive_id=\"messages:<id>\"}]. Use archive_id from current/quoted/replied markers in main_reply_context. Include multiple archive_id items only when the user asks to compare or context clearly needs more than one; do not add unrelated recent images."
task_class = "media_grounding"
policy_action = "system3"
confidence = 0.90
context_tags = [
  "topic:image_description",
  "intent:image_question",
  "intent:visual_description",
  "intent:answer",
  "media:image",
  "capability:visual_understanding",
  "capability:visual_analysis",
  "capability:media_grounding",
]
required_any_tags = [
  "intent:visual_description",
  "capability:visual_understanding",
  "capability:visual_analysis",
]
negative_tags = []

[[capsule]]
id = "managed:visual_memory_send_media"
enabled = true
summary = "Send an exact recalled original image; search with the worker only when no reference was selected"
conversation_kinds = ["group"]
cue = "media_send"
required_any_tags = ["capability:visual_memory_send", "capability:media_retrieval"]
route_hint = "recalled_media_send"
tool_hints = ["router_recalled_media_send"]
tool_steps = [{ tool_name = "router_recalled_media_send", args = {} }]
fallback_steps = [{ task = "visual_memory_send", tool_name = "continuous_brain_worker_task", args = { text = "$current_prompt", archive_id = "$current_archive_key", task_kind = "vm_media_send" }, when = ["missing_reference"] }]
tasklet_tools_args_hint = """按“某人会喜欢”选图时，先用 prefetch_steps 调 router_unified_memory_recall，target_hint填目标原称呼，query_text填“喜欢”（不带人名/问句/搜图词）；取得定向证据后再规划搜图。偏好对象的名字不可直接作query/entity/Tag；不借用他人喜好。无可信喜好则填clarification澄清。发图用 router_recalled_media_send。精确召回原图选证据中的archive_ref或visual_ref；新搜/另换/多张图留空引用并提供search_plan，宿主转给搜索fallback。search_plan 只含 query、context、must_tags、must_any（每组OR，组间AND）、nice_tags、optional_tags、poster_alias、entity、min_age_days/max_age_days、clarification。query只放视觉主体词；随机或仅格式/日期浏览设空。词项保留用户原词及完整短语；context简述本轮语义，不翻译、不猜canonical Tag，宿主统一解析；最多3个必选和3个偏好，不发散变体。must保留全部明确视觉要求，复合要求拆成各自完整属性；must_any仅同义表达，禁止用上位词丢掉颜色/数量等条件。nice只排序。仅本轮明确要求“X发过/分享过的图”才填poster_alias，否则严禁规划poster；“X的图/发一张X”是描绘对象，不是发送者。poster_alias不放视觉词或猜ID；entity仅填明确具名的人物/角色/特定实体；物种、颜色、姿势等通用视觉主体放query/标签，entity留空（如雪豹图）。依据本轮共享召回解析指代。年龄只来自明确要求；日历日期或不连续日期不能表达时填clarification，不猜年龄。数量/格式/排序/截图/情色/重发交Jev判断，勿放plan。禁止命令、路径、库、身份、发送目标。"""
task_class = "visual_memory_send"
policy_action = "fast_agentic"
confidence = 0.85

[[capsule]]
id = "managed:visual_memory_send_private"
enabled = true
summary = "Send media through the authorized private worker"
conversation_kinds = ["dm"]
cue = "media_send"
required_any_tags = ["capability:visual_memory_send", "capability:media_retrieval"]
route_hint = "visual_memory_send"
tool_hints = ["continuous_brain_worker_task"]
tool_steps = [{ tool_name = "continuous_brain_worker_task", args = { text = "$current_prompt", archive_id = "$current_archive_key", task_kind = "vm_media_send" } }]
task_class = "visual_memory_send"
policy_action = "fast_agentic"
confidence = 0.85


tasklet_tools_args_hint = """按“某人会喜欢”选图时，先用 prefetch_steps 调 router_unified_memory_recall，target_hint填目标原称呼，query_text填“喜欢”（不带人名/问句/搜图词）；取得定向证据后再规划搜图。偏好对象的名字不可直接作query/entity/Tag；不借用他人喜好。无可信喜好则填clarification澄清。用 continuous_brain_worker_task，task_kind=vm_media_send，提供search_plan。search_plan 只含 query、context、must_tags、must_any（每组OR，组间AND）、nice_tags、optional_tags、poster_alias、entity、min_age_days/max_age_days、clarification。query只放视觉主体词；随机或仅格式/日期浏览设空。词项保留用户原词及完整短语；context简述本轮语义，不翻译、不猜canonical Tag，宿主统一解析；最多3个必选和3个偏好，不发散变体。must保留全部明确视觉要求，复合要求拆成各自完整属性；must_any仅同义表达，禁止用上位词丢掉颜色/数量等条件。nice只排序。仅本轮明确要求“X发过/分享过的图”才填poster_alias，否则严禁规划poster；“X的图/发一张X”是描绘对象，不是发送者。poster_alias不放视觉词或猜ID；entity仅填明确具名的人物/角色/特定实体；物种、颜色、姿势等通用视觉主体放query/标签，entity留空（如雪豹图）。依据本轮共享召回解析指代。年龄只来自明确要求；日历日期或不连续日期不能表达时填clarification，不猜年龄。数量/格式/排序/截图/情色/重发交Jev判断，勿放plan。禁止命令、路径、库、身份、发送目标。"""
[[capsule]]
id = "managed:visual_memory_correction"
enabled = true
summary = "Correct VisualMemory tags or VisualMemory-to-Entity relation claims"
cue = "visual_memory_correction"
required_tags = ["intent:visual_memory_correction"]
route_hint = "visual_memory_correction"
tool_hints = [
  "router_visual_media_grounding_query",
  "router_visual_memory_correction",
]
tool_steps = [
  { tool_name = "router_visual_media_grounding_query", args = { query = "$current_prompt", context_text = "$context_text", reply_archive_id = "$reply_archive_id", archive_id = "$current_archive_key", force_refresh = true } },
  { tool_name = "router_visual_memory_correction", args = { query = "$current_prompt", archive_ref = "$current_archive_key", apply_mode = "guarded_apply" } },
]
task_class = "visual_memory_correction"
policy_action = "deterministic"
confidence = 0.88
context_tags = [
  "intent:visual_memory_correction",
  "media:image",
  "capability:visual_memory_correction",
]
negative_tags = [
  "intent:public_how_to_lookup",
  "evidence:external_web_needed",
]

[[lexical]]
cue = "media_query"
enabled = true
patterns = [
  "发过吗",
  "找一下",
  "有没有",
  "没有",
  "真的没有",
]
regex = []
adds_tags = [
  "intent:image_question",
  "media:image",
  "capability:visual_memory_query",
]

[[lexical]]
cue = "media_grounding"
enabled = true
patterns = [
  "再看看",
  "重新看",
  "重看",
  "仔细看看",
  "仔细看",
  "看看图里",
  "看图里",
  "看清楚",
  "描述一下这张图",
  "描述这张图",
  "这张图里",
  "这图里",
  "图里有什么",
  "图片里有什么",
  "照片里有什么",
  "这张是什么",
  "这张是谁",
]
regex = [
  "(?:仔细|重新|再)?看.{0,8}(?:这张|这图|图里|图片里|照片里|图上)",
  "描述.{0,8}(?:这张|这图|图片|照片|图里)",
]
adds_tags = [
  "intent:image_question",
  "media:image",
  "capability:media_grounding",
]

[[lexical]]
cue = "media_send"
enabled = true
patterns = [
  "发一张",
  "发张",
  "发个",
  "发一下",
  "发这张",
  "发出来",
  "发出来看看",
  "发图",
  "发送",
  "转发",
  "传图",
  "传一下",
]
regex = []
adds_tags = [
  "intent:image_question",
  "media:image",
  "capability:visual_memory_query",
  "capability:visual_memory_send",
]

[[lexical]]
cue = "visual_memory_correction"
enabled = true
patterns = [
  "不是这个图",
  "不是这张图",
  "不是cb的图",
  "标签错",
  "图标错",
  "认错",
  "错图",
]
regex = [
  "是.+不是.+(?:图|图片|照片|图标|表情)",
  "不是.+(?:的)?(?:图|图片|照片|图标|表情)",
]
adds_tags = [
  "intent:visual_memory_correction",
  "media:image",
  "capability:visual_memory_correction",
]
