[group]
id = "github_repository_lookup"
enabled = true

[[lexical]]
cue = "github_repository_lookup"
enabled = true
patterns = [
  "GitHub 仓库",
  "github 仓库",
  "Github 仓库",
  "GitHub repo",
  "github repo",
  "GitHub repository",
  "github repository",
]
regex = [
  "(GitHub|github|Github).{0,80}(仓库|项目|repo|repository)",
  "(仓库|项目|repo|repository).{0,80}(GitHub|github|Github)",
  "github\\.com[:/]+[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+",
]
adds_tags = [
  "entity:github",
  "capability:github_repository_lookup",
  "intent:public_repo_lookup",
  "evidence:external_web_needed",
]

[[capsule]]
id = "managed:github_repository_lookup"
enabled = true
summary = "Use Codex App Server with agent-reach GitHub tools to inspect and summarize a public repository"
answer_contract = """
Use agent-reach's GitHub path before Browser when possible.
- Prefer gh CLI: gh search repos, gh repo view, gh search code, or gh api repos/OWNER/REPO/readme.
- If a GitHub URL or owner/repo appears in context, inspect that repository directly.
- Answer what the repo does, what the README emphasizes, and a brief usefulness judgment.
- If no confident repository match exists, say so instead of inventing details.
"""
cue = "github_repository_lookup"
route_hint = "codex_app_server"
tool_hints = [
  "codex_app_server_probe",
  "codex_browser_task",
]
tool_steps = [
  { tool_name = "codex_app_server_probe", args = { timeout_sec = 10, port = 4510 } },
  { tool_name = "codex_browser_task", args = { goal = "$current_prompt", allow_submit = false, timeout_sec = 900, port = 4510, execution_contract = "Use agent-reach's GitHub path before Browser when possible. Prefer gh CLI: gh search repos, gh repo view, gh search code, or gh api repos/OWNER/REPO/readme. Answer what the repo does, what the README emphasizes, and a brief usefulness judgment." } },
]
task_class = "codex_browser_task"
policy_action = "fast_agentic"
reply_length_policy = "relaxed"
confidence = 0.93
context_tags = [
  "entity:github",
  "capability:codex_browser_task",
  "capability:github_repository_lookup",
  "intent:public_repo_lookup",
  "evidence:external_web_needed",
]
negative_tags = []
