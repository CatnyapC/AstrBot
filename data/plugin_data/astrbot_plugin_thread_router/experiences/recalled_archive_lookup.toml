[group]
id = "recalled_archive_lookup"
enabled = true

[[lexical]]
cue = "recalled_archive_lookup"
enabled = true
patterns = [
  "撤回",
  "撤回的",
  "重新发",
  "再发一遍",
  "发言记录",
]
regex = []
adds_tags = [
  "intent:fact_lookup",
  "evidence:archive_quote",
  "capability:archive_timeline_lookup",
  "intent:recalled_archive_lookup",
]

[[capsule]]
id = "managed:recalled_archive_lookup"
enabled = true
summary = "Find a locally archived recalled group message by speaker/operator hints"
cue = "recalled_archive_lookup"
route_hint = "timeline_evidence"
tool_hints = [
  "recalled_archive_lookup",
]
tool_steps = [
  { tool_name = "recalled_archive_lookup", args = { limit = 3 } },
]
tasklet_tools_args_hint = "recalled_archive_lookup 只允许传 operator_id、speaker_id、limit。limit 默认 3，表示按时间倒序返回最近 N 条被撤回消息。A撤回/由A撤回/最近A撤回的消息 -> operator_id=A。B的发言记录/B被撤回/小B上次被撤回 -> speaker_id=B。A撤回的一条B发言/A自己发自己撤回 -> operator_id=A 且 speaker_id=B/A。禁止传 query、keywords、before_archive_id、lookback_days、speaker、operator；不要把消息正文词当过滤条件。"
answer_contract = "Use recalled_archive_lookup.tool_context as source of truth. If status=ok, answer with the recalled message text from matches in descending time order and keep attribution concise. If not_found, say no matching recalled archive row was found."
task_class = "recalled_archive_lookup"
policy_action = "deterministic"
confidence = 0.84
context_tags = [
  "intent:recalled_archive_lookup",
  "evidence:archive_quote",
  "capability:archive_timeline_lookup",
]
negative_tags = [
]
