[group]
id = "codex_bilibili_video_lookup"
enabled = true

[[lexical]]
cue = "codex_bilibili_video_lookup"
enabled = true
patterns = [
  "Bilibili 视频",
  "B站 视频",
  "b站视频",
  "哔哩哔哩 视频",
]
regex = [
  "(Bilibili|bilibili|B站|b站|哔哩哔哩).{0,100}(视频链接|链接|BV|找找|搜索|搜|查找|找出)",
  "(?=.*(?:Bilibili|bilibili|B站|b站|哔哩哔哩))(?=.*(?:搜|找找|找一下|查找|找出))(?=.*视频)",
  "(视频页面|视频播放页面|视频缩略图|视频截图).{0,120}(视频链接|链接|找找|搜索|搜|查找|找出)",
]
adds_tags = [
  "entity:bilibili",
  "capability:codex_bilibili_video_lookup",
  "capability:codex_browser_task",
  "intent:find_video_link",
]

[[lexical]]
cue = "codex_bilibili_video_lookup"
enabled = true
requires_tags = ["intent:find_video_link"]
patterns = [
  "Bilibili",
  "bilibili",
  "B站",
  "b站",
  "哔哩哔哩",
]
regex = [
  "(视频页面|视频播放页面|视频缩略图|视频截图)",
]
adds_tags = [
  "entity:bilibili",
  "capability:codex_bilibili_video_lookup",
  "capability:codex_browser_task",
]

[[capsule]]
id = "managed:codex_bilibili_video_lookup"
enabled = true
summary = "Use Codex browser to find and verify a Bilibili video link from screenshot/current context"
cue = "codex_bilibili_video_lookup"
route_hint = "codex_app_server"
tool_hints = [
  "continuous_brain_worker_task",
]
task_class = "codex_browser_task"
policy_action = "fast_agentic"
confidence = 0.96
context_tags = [
  "entity:bilibili",
  "capability:codex_bilibili_video_lookup",
  "capability:codex_browser_task",
  "intent:find_video_link",
]
required_tags = [
  "capability:codex_bilibili_video_lookup",
]
negative_tags = []

[[capsule.tool_steps]]
tool_name = "continuous_brain_worker_task"

[capsule.tool_steps.args]
task_kind = "codex_browser_task"
timeout_sec = 900
worker_prompt = """
这是 Bilibili 视频定位任务。直接执行，不读取额外 SKILL。
- 检查 latest_context 中当前、引用及附件图片；从图片本身提取标题、UP 主、BV 号和可辨识关键词，caption/OCR 只作提示。
- Agent Reach 只允许使用 Bilibili CLI：`bili search "<从图片提取的标题、UP主或关键词>" --type video -n 5`。先用精确文字搜索，必要时再用 Browser 核验候选页面。
- 必须按标题、UP 主、BV 号或画面证据核验，不得把仅有相似短标题的候选当成结果。
- 唯一产出是运行 `uv run python worker_tools/write_worker_outbox.py` 写 `worker_rich_outbox`，禁止直接发消息或写进度。
- 找到并核验时用 `--status ok`，`--text` 简短写标题、UP主、BV号、URL和核验证据，并用 `--ref-url` 写最终 URL。
- 缺少可搜索文字、图片不可读或候选歧义需要用户补充时，用 `--status needs_user`，明确还需要什么。
- 搜索或核验确定无法完成时用 `--status failed` 并写明原因。此任务不得使用 `waiting_external` 或 `not_found`。
"""
