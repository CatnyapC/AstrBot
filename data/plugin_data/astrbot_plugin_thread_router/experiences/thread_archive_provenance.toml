[group]
id = "thread_archive_provenance"
enabled = true

[[lexical]]
cue = "claim_query"
enabled = true
patterns = [
  "证据",
  "原话",
  "来源",
  "最早",
  "谁说",
  "谁先",
  "谁最先",
  "谁称呼",
  "谁认为",
  "谁说过",
]
regex = []
adds_tags = [
  "intent:fact_lookup",
  "intent:who_said",
  "evidence:archive_quote",
]

[[capsule]]
id = "seed:local_exact_archive_evidence_lookup"
enabled = true
summary = "Who said / local exact evidence from archive timeline"
cue = "claim_query"
route_hint = "local_exact"
tool_hints = [
  "router_timeline_context",
]
tool_steps = [
  { tool_name = "router_timeline_context", args = { query = "$current_prompt", keywords = ["$current_prompt"], mode = "keyword_search", before_archive_id = "$current_archive_key", lookback_days = 365, limit = 8 } },
]
task_class = "archive_evidence_lookup"
policy_action = "fast_agentic"
confidence = 0.82
negative_tags = []

[[capsule]]
id = "managed:thread_archive_provenance_lookup"
enabled = true
summary = "Who said / earliest local archive provenance with quote evidence"
cue = "claim_query"
route_hint = "timeline_evidence"
tool_hints = [
  "router_timeline_context",
]
tool_steps = [
  { tool_name = "router_timeline_context", args = { query = "$current_prompt", keywords = ["$current_prompt"], mode = "who_last", before_archive_id = "$current_archive_key", lookback_days = 365, limit = 12 } },
]
answer_contract = "Use router_timeline_context.answer_grounding and evidence_rows as source of truth. Prefer earliest direct quote/speaker evidence; say no archive evidence when empty."
task_class = "claim_lookup"
policy_action = "fast_agentic"
confidence = 0.86
context_tags = [
  "intent:who_said",
  "evidence:archive_quote",
  "capability:archive_timeline_lookup",
]
negative_tags = [
  "evidence:external_web_needed",
]

[[capsule]]
id = "seed:social_claim_timeline_lookup"
enabled = true
summary = "Who said / who called / who claimed query"
cue = "claim_query"
route_hint = "timeline_evidence"
tool_hints = [
  "router_timeline_context",
]
tool_steps = [
  { tool_name = "router_timeline_context", args = { query = "$current_prompt", keywords = ["$current_prompt"], mode = "keyword_search", before_archive_id = "$current_archive_key", lookback_days = 365, limit = 8 } },
]
task_class = "claim_lookup"
policy_action = "fast_agentic"
confidence = 0.78
negative_tags = []
