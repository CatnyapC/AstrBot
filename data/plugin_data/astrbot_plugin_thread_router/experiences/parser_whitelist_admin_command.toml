[[capsule]]
id = "managed:parser_whitelist_admin_command"
conversation_kinds = ["group"]
enabled = true
summary = "Parser whitelist management through continuous parser command worker"
answer_contract = """
Use the parser command worker to convert natural parser whitelist requests into a safe structured action.
- Supported operations: list, add, remove, clear.
- Do not expose raw /parserwl command text to the main LLM.
- Router validates group admin/owner permission, resolves target aliases, formats the safe command, sends it, archives it, then waits for parser/FoxMiao confirmation.
- If status=waiting_external, only say the request was sent and Foxmi is waiting for parser/FoxMiao confirmation; do not claim the whitelist changed.
- If status=needs_user/not_found, ask for the exact target user.
"""
cue = "parser_whitelist_admin"
required_tags = ["capability:parser_whitelist_admin"]
route_hint = "parser_whitelist_admin"
tool_hints = ["parser_whitelist_admin_command"]
tool_steps = [
  { tool_name = "parser_whitelist_admin_command", args = { text = "$current_prompt" } },
]
task_class = "parser_whitelist_admin_command"
policy_action = "fast_agentic"
confidence = 0.93
