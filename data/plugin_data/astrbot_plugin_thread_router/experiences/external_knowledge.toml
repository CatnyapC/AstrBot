[[lexical]]
cue = "mediawiki_public_source"
enabled = true
patterns = [
  "未知伤亡",
  "Scav Prototype",
  "Casualties: Unknown",
]
regex = []
adds_tags = [
  "capability:mediawiki_public_lookup",
  "source:mediawiki_scavprototype",
  "topic:game_guide",
]

[[capsule]]
id = "managed:mediawiki_scavprototype_public_source"
enabled = true
summary = "Public MediaWiki lookup for Scav Prototype / Casualties: Unknown game guide questions"
cue = "mediawiki_public_source"
route_hint = "external_knowledge"
tool_hints = [
  "bailian_external_knowledge",
  "mediawiki_public_lookup",
]
task_class = "external_knowledge_lookup"
policy_action = "system3"
reply_length_policy = "relaxed"
confidence = 0.92
context_tags = [
  "capability:external_lookup",
  "capability:mediawiki_public_lookup",
  "capability:information_retrieval",
  "topic:game_guide",
  "source:mediawiki_scavprototype",
]
required_tags = [
  "evidence:external_web_needed",
  "capability:mediawiki_public_lookup",
]
optional_tags = [
  "capability:mediawiki_public_lookup",
  "capability:information_retrieval",
  "intent:how_to_make",
  "intent:public_how_to_lookup",
  "topic:game_guide",
]
negative_tags = []
provider_preset = "no_site_limit"
fallback_when = [
  "unverified",
  "insufficient",
  "failed",
  "timeout",
  "source_count_zero",
  "verification_unverified",
]
fallback_steps = [
  { tool = "mediawiki_public_lookup", when = ["unverified", "insufficient", "failed", "timeout", "source_count_zero", "verification_unverified"], args = { api_urls = ["https://scavprototype.wiki.gg/api.php"], limit = 3 } },
  { tool = "knowledge_reference", when = ["unverified", "insufficient", "failed", "timeout", "source_count_zero", "verification_unverified"], args = { reason = "external_knowledge_fallback" } },
]

[[capsule]]
id = "managed:external_reference_lookup_public_source"
enabled = true
