[group]
id = "external_knowledge"
enabled = true

[[lexical]]
cue = "external_source"
enabled = true
patterns = [
  "外部资料",
  "外部来源",
  "外部工具",
  "外部",
  "查一下",
  "再查",
  "查外部",
  "搜索",
  "搜一下",
  "搜一搜",
  "搜搜",
  "帮我搜",
  "上网查",
  "公开资料",
  "wiki",
  "网上搜",
  "怎么做",
  "如何做",
  "怎么制作",
  "如何制作",
  "怎么合成",
  "如何合成",
  "配方",
  "做法",
  "攻略",
  "出处",
  "出自",
  "来源",
  "原文",
  "原句",
  "谁说的",
  "哪部作品",
  "哪个游戏",
  "什么梗",
  "最新",
  "最近",
  "今天",
  "新闻",
  "价格",
  "版本",
  "发布",
]
regex = [
  "how\\s+to",
  "recipe",
  "craft",
  "source",
  "origin",
  "current",
  "latest",
  "today",
  "news",
  "price",
  "version",
  "(?:外部工具|外部).{0,20}(?:搜|查)",
]
adds_tags = [
  "capability:external_lookup",
  "capability:information_retrieval",
  "evidence:external_web_needed",
]

